<section id="features" class="features-section">
  <div class="container">
    <div class="section-heading text-center">
      <span class="section-badge">What I Do</span>

      <h2>Frontend Work I Do</h2>

      <p>
        I focus on building clean, responsive, and maintainable frontend
        experiences using Angular, TypeScript, and modern web technologies.
      </p>
    </div>

    <div class="row g-4 justify-content-center">
      @for (feature of features; track feature.title) {
        <div class="col-12 col-md-6 col-lg-4">
          <article class="feature-card">
            <div class="feature-icon">
              <i [class]="'bi ' + feature.icon" aria-hidden="true"></i>
            </div>

            <h3>{{ feature.title }}</h3>

            <p>
              {{ feature.description }}
            </p>
          </article>
        </div>
      }
    </div>
  </div>
</section>
