<footer id="footer" class="main-footer">
  <div class="container">
    <div class="footer-content">
      <div class="footer-brand">
        <h3>Mahmoud Mohamed</h3>
        <p>Software Engineer | Angular Frontend Developer</p>
      </div>

      <nav class="footer-nav" aria-label="Footer navigation">
        @for (link of navigationLinks; track link.href) {
          <a [href]="link.href">
            {{ link.label }}
          </a>
        }
      </nav>

      <div class="footer-social" aria-label="Social and contact links">
        @for (link of socialLinks; track link.href) {
          <a
            [href]="link.href"
            [attr.target]="link.external ? '_blank' : null"
            [attr.rel]="link.external ? 'noopener noreferrer' : null"
            [attr.aria-label]="link.label"
            [attr.title]="link.label"
          >
            <i [class]="'bi ' + link.icon" aria-hidden="true"></i>
          </a>
        }
      </div>
    </div>

    <div class="footer-bottom">
      <small> © {{ currentYear }} Mahmoud Mohamed. All rights reserved. </small>

      <small class="footer-built-with">
        Built with Angular &amp; TypeScript
      </small>
    </div>
  </div>

  @if (showBackToTop()) {
    <button
      class="back-to-top"
      type="button"
      (click)="scrollToTop()"
      aria-label="Back to top"
      title="Back to top"
    >
      <i class="bi bi-arrow-up" aria-hidden="true"></i>
    </button>
  }
</footer>
