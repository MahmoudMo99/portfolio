      <div class="footer-brand">
        <h3>Mahmoud Mohamed</h3>
        <p>Software Engineer | Angular Frontend Developer</p>

      <nav class="footer-nav" aria-label="Footer navigation">

        <a href="#portfolio">Projects</a>
        <a href="#contact">Contact</a>
      </nav>

      <div class="footer-social" aria-label="Social links">
        <a
          href="https://github.com/MahmoudMo99"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="GitHub profile"
        >
          <i class="bi bi-github" aria-hidden="true"></i>

        <a
          href="https://www.linkedin.com/in/mahmoud-mo-mahmoud"
          target="_blank"
          rel="noopener noreferrer"

          <i class="bi bi-linkedin" aria-hidden="true"></i>

        <a
          href="mailto:mahmoud.mmi.dev@gmail.com"
          aria-label="Send email to Mahmoud Mohamed"
        >
          <i class="bi bi-envelope-fill" aria-hidden="true"></i>

          target="_blank"

    </div>

    <div class="footer-bottom">
      <small>© {{ currentYear }} Mahmoud Mohamed. All rights reserved.</small>
    </div>

  @if (showBackToTop()) {
    <button
      class="back-to-top"
      type="button"
      (click)="scrollToTop()"
      aria-label="Back to top"
      title="Back to top"
    >
      <i class="bi bi-arrow-up" aria-hidden="true"></i>
    </button>
  }
