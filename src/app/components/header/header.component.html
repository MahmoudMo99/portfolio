<header class="main-header" [class.header-scrolled]="isScrolled()">
  <nav class="navbar" aria-label="Main navigation">
    <div class="container">
      <a
        class="navbar-brand"
        href="#home"
        aria-label="Mahmoud Mohamed — Home"
        (click)="navigateTo('home')"
      >
        <span class="avatar-wrapper" aria-hidden="true">
          <img
            src="images/mahmoud.jpg"
            alt=""
            class="avatar-img"
            width="42"
            height="42"
          />
        </span>

        <span class="brand-name">Mahmoud Mohamed</span>
      </a>

      <button
        class="menu-button"
        type="button"
        aria-controls="navbarNav"
        [attr.aria-expanded]="isMenuOpen()"
        [attr.aria-label]="
          isMenuOpen() ? 'Close navigation' : 'Open navigation'
        "
        [class.is-open]="isMenuOpen()"
        (click)="toggleMenu()"
      >
        <span class="menu-line"></span>
        <span class="menu-line"></span>
        <span class="menu-line"></span>
      </button>

      <div class="navigation" id="navbarNav" [class.is-open]="isMenuOpen()">
        <ul class="nav-list">
          @for (link of navLinks; track link.id) {
            <li>
              <a
                class="nav-link"
                [class.active]="activeSection() === link.id"
                [attr.aria-current]="
                  activeSection() === link.id ? 'location' : null
                "
                [href]="'#' + link.id"
                (click)="navigateTo(link.id)"
              >
                {{ link.label }}
              </a>
            </li>
          }
        </ul>

        <a
          href="cv/Mahmoud.Mohamed.CV.pdf"
          download="Mahmoud-Mohamed-CV.pdf"
          class="cv-btn"
          aria-label="Download Mahmoud Mohamed CV as PDF"
          (click)="closeMenu()"
        >
          <i class="bi bi-download" aria-hidden="true"></i>
          <span>Download CV</span>
        </a>
      </div>
    </div>
  </nav>
</header>
